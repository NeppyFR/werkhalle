<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkhalle</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%2312171c'/%3E%3Cpath fill='%23b4bec8' d='M3 3h3v4h4V3h3v10h-3V9H6v4H3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/hall.css">
<link rel="stylesheet" href="css/drawer.css">
<link rel="stylesheet" href="css/failure.css">
<link rel="stylesheet" href="css/leitstand.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="topbar" id="topbar"></header>
  <nav class="rail" id="rail" aria-label="Hauptnavigation"></nav>
  <main class="main" id="main" tabindex="-1">
    <div class="offline" id="offline" role="alert" hidden></div>
    <div class="view-host" id="view"></div>
    <section class="failure" id="failure" aria-label="Störungskette und Neuplanung" hidden></section>
  </main>
  <aside class="drawer" id="drawer" aria-label="Maschinendetails" hidden></aside>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<noscript><p style="padding:24px;color:#e2e7ec">Werkhalle braucht JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
